# H200 NVL peaks for the roofline.
#
# Verified against the NVIDIA H200 Tensor Core GPU Datasheet, document
# 3512650.Nov24. Two things that datasheet makes explicit and that are the
# usual source of wrong rooflines:
#
#   1. Footnote 2 ("With sparsity") is attached to the TF32/BF16/FP16/FP8/INT8
#      rows. Every tensor-core figure NVIDIA publishes for H200 is the SPARSE
#      number. Dense is exactly half. The dense figures below are published/2.
#   2. H200 NVL and H200 SXM share memory (141 GB, 4.8 TB/s) but NOT compute.
#      NVL is a clock/power-cut part: 835.5 dense BF16 vs SXM's 989.5. Using an
#      SXM number here would understate measured efficiency by about 16%.
#
# Footnote 1 of the same datasheet marks ALL H200 specifications "preliminary".
# Carry that caveat into anything published from these numbers.

name: NVIDIA H200 NVL
verified: true
source: https://dam-cdn.nvd.orangelogic.com/AssetLink/5o2qgy5d2835ve2pm11i62kv8mphqta8.pdf
source_note: >-
  NVIDIA H200 Tensor Core GPU Datasheet, doc 3512650.Nov24. Dense values are the
  published sparse figures halved, per datasheet footnote 2. All H200 specs are
  marked preliminary per footnote 1.
checked_by: NVIDIA datasheet 3512650.Nov24
checked_on: 2026-08-21

# torch reports both parts as plain "NVIDIA H200", so the name cannot tell them
# apart. Power limit can: 600 W confirms NVL; SXM is 700 W. `nvidia-smi --query-gpu=power.limit` settles it
# in one line, and roofline.for_device uses it to break the tie.
tdp_w: 600

memory:
  capacity_gb: 141          # HBM3e
  bandwidth_tb_s: 4.8       # identical on NVL and SXM

# DENSE tensor-core peaks, TFLOP/s.
compute_dense_tflops:
  fp32: null                # not used by the current sweep
  bf16: 835.5               # published 1671 with sparsity
  fp16: 835.5               # published 1671 with sparsity
  fp8_e4m3: 1670.5          # published 3341 with sparsity; NVIDIA does not
                            # break E4M3 out from E5M2, this is the unified rate

# For contrast, so an SXM number is never pasted in here by accident.
sibling_part_h200_sxm:
  bandwidth_tb_s: 4.8
  bf16_dense_tflops: 989.5
  sm_count: 132
  l2_mib: 50

# NVIDIA does not publish these for the NVL part. Filled from
# torch.cuda.get_device_properties at run time; until then they stay null so
# nothing silently uses an SXM value.
observed:
  sm_count: null            # UNVERIFIED for NVL; SXM is 132
  l2_bytes: null            # UNVERIFIED for NVL; GH100 die L2 is 50 MiB
