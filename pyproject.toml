[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "moe-kernels"
version = "0.1.0"
description = "MoE grouped-GEMM kernel work on H200: span-tiled harness, real routing traces, roofline"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "matplotlib", "pyyaml"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
include = ["moe*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "gpu: requires a CUDA device (auto-skipped off the box by tests/conftest.py)",
  "no_gpu: asserts the laptop path (auto-skipped when a CUDA device is attached)",
  "slow: full-size geometry, minutes not seconds",
]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py310"
# The scorers under scripts/scoring are kept byte-for-byte as they ran (they produced
# the published verdicts), not restyled.
extend-exclude = ["scripts/scoring"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
